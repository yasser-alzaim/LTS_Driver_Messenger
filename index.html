<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTS Driver Messenger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f6;color:#17202a}
.wrap{max-width:1500px;margin:0 auto;padding:20px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
h1{margin:0;font-size:27px;color:#17365D}
.stats{font-size:13px;color:#5b6573;margin-top:5px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.07);padding:16px;margin-bottom:14px}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media(max-width:850px){.toolbar{grid-template-columns:1fr}}
input,textarea,select,button{font:inherit;border:1px solid #cbd3dc;border-radius:8px;padding:10px;background:#fff}
textarea{width:100%;min-height:90px;resize:vertical}
button{cursor:pointer;font-weight:700}
.primary{background:#1769aa;color:#fff;border-color:#1769aa}
.green{background:#2e7d32;color:#fff;border-color:#2e7d32}
.wa{background:#1d9f5a;color:#fff;border-color:#1d9f5a}
.light{background:#f5f8fb}
.danger{background:#fff2f2;color:#a61b1b;border-color:#e6b7b7}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls button{width:auto}
.campaign{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.campaign{grid-template-columns:1fr}}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px;color:#4c5968}
.list{overflow:auto;max-height:62vh;border:1px solid #d9e0e8;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:1050px}
thead th{position:sticky;top:0;background:#17365D;color:white;z-index:2;padding:10px;text-align:left;font-size:12px}
tbody td{border-bottom:1px solid #e8edf2;padding:8px;vertical-align:top}
tbody tr:nth-child(even){background:#f8fbfe}
tbody tr.selected{background:#e8f3ff}
.name{font-weight:700}
.small{font-size:12px;color:#6b7580}
.rowmsg{width:100%;min-height:58px}
.check{width:18px;height:18px}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700}
.ok{background:#e0f2e3;color:#216a2a}
.missing{background:#fff0d7;color:#8b5b00}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.result{margin-top:12px;padding:10px;border-radius:8px;background:#f3f7fb;white-space:pre-wrap;display:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:16px;z-index:20}
.modalbox{background:#fff;width:min(620px,100%);border-radius:12px;padding:18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.formgrid{grid-template-columns:1fr}}
.queue{display:none;background:#eaf8ef;border:1px solid #b9dfc5;border-radius:10px;padding:12px;margin-top:12px}
code{background:#f1f3f5;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div>
    <h1>LTS Driver Messenger</h1>
    <div class="stats" id="stats">Loading...</div>
  </div>
  <div class="controls">
    <button onclick="openContact()">+ Add Driver</button>
    <button onclick="loadAll()">Refresh</button>
  </div>
</div>

<div class="card">
  <div class="toolbar">
    <div>
      <label>Search driver</label>
      <input id="search" style="width:100%" placeholder="Name, Driver ID, email or phone" oninput="render()">
    </div>

    <div>
      <label>Attachment mode</label>
      <select id="attachmentMode" style="width:100%" onchange="toggleSameFile()">
        <option value="DRIVER_QR">Each driver's QR</option>
        <option value="PERSONAL_FILE">Each driver's personal file</option>
        <option value="SAME_FILE">Same Drive file for everyone</option>
        <option value="MESSAGE_ONLY">Message only</option>
      </select>
    </div>

    <div id="sameFileWrap" style="display:none">
      <label>Same Drive file ID / URL</label>
      <input id="sameFileId" style="width:100%" placeholder="Drive file ID or URL">
    </div>
  </div>

  <div class="campaign" style="margin-top:12px">
    <div>
      <label>Email subject</label>
      <input id="subject" style="width:100%" value="LTS Information">
    </div>

    <div>
      <label>Global message — placeholders: {name}, {id}, {email}, {phone}</label>
      <textarea id="globalMessage" placeholder="Hello {name},&#10;&#10;Please find your personal QR attached."></textarea>
    </div>
  </div>

  <div class="controls" style="margin-top:10px">
    <button onclick="selectVisible(true)">Select All Visible</button>
    <button onclick="selectVisible(false)">Clear Visible</button>
    <button onclick="applyGlobal()">Apply Global Message to Selected</button>
  </div>
</div>

<div class="card">
  <div class="list">
    <table>
      <thead>
        <tr>
          <th style="width:50px">Send</th>
          <th style="width:90px">ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>WhatsApp</th>
          <th style="min-width:360px">Personal Message</th>
          <th style="width:100px">Edit</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    <div><b id="selectedCount">0 selected</b></div>
    <div class="controls">
      <button class="green" onclick="sendEmail()">SEND SELECTED BY EMAIL</button>
      <button class="wa" onclick="startWhatsAppQueue()">OPEN NORMAL WHATSAPP QUEUE</button>
      <button class="wa" onclick="sendWhatsAppAPI()">WHATSAPP CLOUD API</button>
    </div>
  </div>

  <div id="waQueue" class="queue">
    <b id="waQueueTitle"></b>
    <div id="waQueueText" style="margin:8px 0"></div>
    <div class="controls">
      <button class="wa" onclick="openCurrentWhatsApp()">Open WhatsApp</button>
      <button onclick="nextWhatsApp()">Next Driver</button>
      <button onclick="stopWhatsAppQueue()">Close Queue</button>
    </div>
    <div class="small" style="margin-top:8px">
      Normal WhatsApp can receive the prepared message, but a browser cannot automatically attach the personal QR file.
      Use the Cloud API later if you want automatic personalized attachments.
    </div>
  </div>

  <div id="result" class="result"></div>
</div>

</div>

<div id="modal" class="modal">
  <div class="modalbox">
    <h3 id="modalTitle">Driver</h3>

    <div class="formgrid">
      <div>
        <label>Driver ID</label>
        <input id="mId" style="width:100%">
      </div>

      <div>
        <label>Name</label>
        <input id="mName" style="width:100%">
      </div>

      <div>
        <label>Email</label>
        <input id="mEmail" style="width:100%">
      </div>

      <div>
        <label>WhatsApp Phone</label>
        <input id="mPhone" style="width:100%" placeholder="+43...">
      </div>

      <div style="grid-column:1/-1">
        <label>Default Message</label>
        <textarea id="mDefault"></textarea>
      </div>

      <div style="grid-column:1/-1">
        <label>Personal Drive File ID / URL</label>
        <input id="mFile" style="width:100%">
      </div>

      <div style="grid-column:1/-1">
        <label>Notes</label>
        <textarea id="mNotes"></textarea>
      </div>
    </div>

    <div class="controls" style="margin-top:12px;justify-content:flex-end">
      <button class="danger" id="deleteBtn" onclick="deleteCurrent()">Delete</button>
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveCurrent()">Save</button>
    </div>
  </div>
</div>

<script>
/*
  IMPORTANT:
  After you deploy Code.gs as an Apps Script Web App,
  paste the /exec URL between the quotes below.
*/
const API_URL = 'https://script.google.com/macros/s/AKfycbzQJN7JPFuGnSRfUwwx_-qlGiROepPsb61tBPumiwriyQxUuc4_G975aRWD-aGA9DAC/exec';

let contacts = [];
let selected = {};
let messages = {};
let editingId = '';

let waItems = [];
let waIndex = 0;

const pending = {};

window.addEventListener('message', event => {
  const data = event.data || {};
  if (!data.requestId || !pending[data.requestId]) return;

  const p = pending[data.requestId];
  delete pending[data.requestId];

  if (data.ok) p.resolve(data.result);
  else p.reject(new Error(data.error || 'Backend request failed.'));
});

function api(action, data = {}) {
  if (!API_URL || API_URL.includes('PASTE_YOUR_')) {
    return Promise.reject(new Error(
      'Add your Apps Script /exec URL to API_URL inside index.html first.'
    ));
  }

  return new Promise((resolve, reject) => {
    const requestId =
      'req_' + Date.now() + '_' + Math.random().toString(36).slice(2);

    pending[requestId] = {resolve, reject};

    const iframe = document.createElement('iframe');
    iframe.name = 'api_' + requestId;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = API_URL;
    form.target = iframe.name;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify({action, data, requestId});

    form.appendChild(input);
    document.body.appendChild(form);

    const timeout = setTimeout(() => {
      if (pending[requestId]) {
        delete pending[requestId];
        reject(new Error('Backend timeout. Check your Apps Script deployment.'));
      }
      form.remove();
      iframe.remove();
    }, 30000);

    const originalResolve = pending[requestId].resolve;
    const originalReject = pending[requestId].reject;

    pending[requestId].resolve = value => {
      clearTimeout(timeout);
      setTimeout(() => { form.remove(); iframe.remove(); }, 50);
      originalResolve(value);
    };

    pending[requestId].reject = err => {
      clearTimeout(timeout);
      setTimeout(() => { form.remove(); iframe.remove(); }, 50);
      originalReject(err);
    };

    form.submit();
  });
}

async function loadAll() {
  setResult('Loading...');

  try {
    const [c, info] = await Promise.all([
      api('getContacts'),
      api('getAppInfo')
    ]);

    contacts = c;

    document.getElementById('stats').textContent =
      `${info.contactCount} drivers • ` +
      `Email quota remaining today: ${info.emailQuota} • ` +
      `WhatsApp Cloud API: ${info.whatsappConfigured ? 'configured' : 'not configured'}`;

    contacts.forEach(x => {
      if (messages[x.id] === undefined) {
        messages[x.id] = x.defaultMessage || '';
      }
    });

    render();
    hideResult();
  } catch (e) {
    setResult(e.message);
  }
}

function filtered() {
  const q = document.getElementById('search').value.trim().toLowerCase();

  if (!q) return contacts;

  return contacts.filter(c =>
    [c.id,c.name,c.email,c.phone]
      .join(' ')
      .toLowerCase()
      .includes(q)
  );
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function render() {
  const tb = document.getElementById('tbody');

  tb.innerHTML = filtered().map(c => {
    const sel = !!selected[c.id];

    const emailStatus = c.email
      ? '<span class="pill ok">Email</span>'
      : '<span class="pill missing">No email</span>';

    const phoneStatus = c.phone
      ? '<span class="pill ok">Phone</span>'
      : '<span class="pill missing">No phone</span>';

    return `
      <tr class="${sel ? 'selected' : ''}">
        <td>
          <input class="check" type="checkbox"
            ${sel ? 'checked' : ''}
            onchange="toggleSel('${esc(c.id)}',this.checked)">
        </td>

        <td><b>${esc(c.id)}</b></td>

        <td>
          <div class="name">${esc(c.name)}</div>
        </td>

        <td>
          ${esc(c.email)}<br>${emailStatus}
        </td>

        <td>
          ${esc(c.phone)}<br>${phoneStatus}
        </td>

        <td>
          <textarea class="rowmsg"
            oninput="messages['${esc(c.id)}']=this.value">${esc(messages[c.id] || '')}</textarea>
        </td>

        <td>
          <button onclick="openContact('${esc(c.id)}')">Edit</button>
        </td>
      </tr>
    `;
  }).join('');

  updateSelectedCount();
}

function toggleSel(id,on) {
  selected[id] = on;
  render();
}

function updateSelectedCount() {
  const n = Object.values(selected).filter(Boolean).length;
  document.getElementById('selectedCount').textContent = `${n} selected`;
}

function selectVisible(on) {
  filtered().forEach(c => selected[c.id] = on);
  render();
}

function applyGlobal() {
  const text = document.getElementById('globalMessage').value;

  contacts
    .filter(c => selected[c.id])
    .forEach(c => messages[c.id] = text);

  render();
}

function toggleSameFile() {
  document.getElementById('sameFileWrap').style.display =
    document.getElementById('attachmentMode').value === 'SAME_FILE'
      ? 'block'
      : 'none';
}

function selectedPayload() {
  return contacts
    .filter(c => selected[c.id])
    .map(c => ({
      id:c.id,
      message:messages[c.id] || ''
    }));
}

async function sendEmail() {
  const items = selectedPayload();

  if (!items.length) {
    return alert('Select at least one driver.');
  }

  if (!confirm(`Send email to ${items.length} selected drivers?`)) {
    return;
  }

  setResult('Sending email...');

  try {
    const res = await api('sendEmailSelected', {
      items,
      subject:document.getElementById('subject').value,
      attachmentMode:document.getElementById('attachmentMode').value,
      sameFileId:document.getElementById('sameFileId').value
    });

    showResults(
      res.results,
      `Email finished. Remaining quota: ${res.remainingEmailQuota}`
    );

    await loadAll();
  } catch (e) {
    setResult(e.message);
  }
}

async function sendWhatsAppAPI() {
  const items = selectedPayload();

  if (!items.length) {
    return alert('Select at least one driver.');
  }

  if (!confirm(`Send WhatsApp through Cloud API to ${items.length} selected drivers?`)) {
    return;
  }

  setResult('Sending WhatsApp...');

  try {
    const res = await api('sendWhatsAppSelected', {
      items,
      attachmentMode:document.getElementById('attachmentMode').value,
      sameFileId:document.getElementById('sameFileId').value
    });

    showResults(res.results,'WhatsApp finished.');
    await loadAll();
  } catch (e) {
    setResult(e.message);
  }
}

/* Normal WhatsApp queue for your existing non-Business/API account */
function startWhatsAppQueue() {
  waItems = contacts.filter(c => selected[c.id]);

  if (!waItems.length) {
    return alert('Select at least one driver.');
  }

  const missingPhone = waItems.filter(c => !c.phone);

  if (missingPhone.length) {
    const ok = confirm(
      `${missingPhone.length} selected drivers have no WhatsApp phone. ` +
      `They will be skipped. Continue?`
    );

    if (!ok) return;
  }

  waItems = waItems.filter(c => c.phone);
  waIndex = 0;

  document.getElementById('waQueue').style.display = 'block';
  showWhatsAppCurrent();
}

function personalizeLocal(text,c) {
  return String(text || '')
    .replace(/\{name\}/gi,c.name || '')
    .replace(/\{id\}/gi,c.id || '')
    .replace(/\{email\}/gi,c.email || '')
    .replace(/\{phone\}/gi,c.phone || '');
}

function showWhatsAppCurrent() {
  if (!waItems.length || waIndex >= waItems.length) {
    document.getElementById('waQueueTitle').textContent = 'WhatsApp queue finished';
    document.getElementById('waQueueText').textContent = '';
    return;
  }

  const c = waItems[waIndex];

  document.getElementById('waQueueTitle').textContent =
    `${waIndex + 1} / ${waItems.length} — ${c.name} (${c.id})`;

  document.getElementById('waQueueText').textContent =
    personalizeLocal(messages[c.id] || c.defaultMessage || '',c);
}

function openCurrentWhatsApp() {
  if (!waItems.length || waIndex >= waItems.length) return;

  const c = waItems[waIndex];
  const phone = String(c.phone || '').replace(/[^\d]/g,'');
  const msg = personalizeLocal(messages[c.id] || c.defaultMessage || '',c);

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
    '_blank'
  );
}

function nextWhatsApp() {
  if (!waItems.length) return;
  waIndex++;
  showWhatsAppCurrent();
}

function stopWhatsAppQueue() {
  document.getElementById('waQueue').style.display = 'none';
  waItems = [];
  waIndex = 0;
}

function showResults(results,title) {
  const sent = results.filter(x => x.status === 'SENT').length;
  const failed = results.length - sent;

  const errors = results
    .filter(x => x.status !== 'SENT')
    .slice(0,20)
    .map(x => `${x.id} ${x.name}: ${x.error}`)
    .join('\n');

  setResult(
    `${title}\nSent: ${sent}\nFailed: ${failed}` +
    (errors ? '\n\n' + errors : '')
  );
}

function setResult(t) {
  const el = document.getElementById('result');
  el.style.display = 'block';
  el.textContent = t;
}

function hideResult() {
  document.getElementById('result').style.display = 'none';
}

function openContact(id='') {
  editingId = id;

  const c = contacts.find(x => x.id === id) || {
    id:'',
    name:'',
    email:'',
    phone:'',
    defaultMessage:'',
    personalFile:'',
    notes:''
  };

  document.getElementById('modalTitle').textContent =
    id ? 'Edit Driver' : 'Add Driver';

  document.getElementById('mId').value = c.id;
  document.getElementById('mName').value = c.name;
  document.getElementById('mEmail').value = c.email;
  document.getElementById('mPhone').value = c.phone;
  document.getElementById('mDefault').value = c.defaultMessage;
  document.getElementById('mFile').value = c.personalFile;
  document.getElementById('mNotes').value = c.notes;

  document.getElementById('mId').disabled = !!id;
  document.getElementById('deleteBtn').style.display =
    id ? 'inline-block' : 'none';

  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

async function saveCurrent() {
  const c = {
    id:document.getElementById('mId').value.trim(),
    name:document.getElementById('mName').value.trim(),
    email:document.getElementById('mEmail').value.trim(),
    phone:document.getElementById('mPhone').value.trim(),
    defaultMessage:document.getElementById('mDefault').value,
    personalFile:document.getElementById('mFile').value.trim(),
    notes:document.getElementById('mNotes').value
  };

  if (!c.id) return alert('Driver ID is required.');

  try {
    await api('saveContact',c);
    closeModal();
    await loadAll();
  } catch (e) {
    alert(e.message);
  }
}

async function deleteCurrent() {
  if (!editingId) return;

  if (!confirm(`Delete driver ${editingId} from Messenger contacts?`)) {
    return;
  }

  try {
    await api('deleteContact',{driverId:editingId});
    delete selected[editingId];
    delete messages[editingId];
    closeModal();
    await loadAll();
  } catch (e) {
    alert(e.message);
  }
}

loadAll();
</script>
</body>
</html>
